name: Engine Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verificar dependencias enlazadas
        run: bash .github/scripts/check-linked-dependencies.sh
      - name: Verify SDK publication rejects shaded variants and missing prerequisites
        run: python3 .github/scripts/test-central-server-publication.py
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Auditar POM del Engine Server para Maven Central (sin publicar)
        shell: bash
        run: |
          ./gradlew :server:generatePomFileForMavenPublication \
            -PcentralRelease=true --no-daemon
          python3 .github/scripts/verify-central-server-pom.py
          python3 .github/scripts/audit-central-resolution.py \
            --pending io.github.ryzemcbe:bedrock-connection:1.26.60-R1 \
            --pending io.github.ryzemcbe:ryze-netty-transport-nethernet:2.0.0.CR6-ryze.1 \
            --pending io.github.ryzemcbe:ryze-okaeri-configs-yaml-snakeyaml:5.0.13-ryze.1 \
            server/build/publications/maven/pom-default.xml
          echo "::notice::PR-only integration: pending organization-owned modules allowed; FINAL release workflow rejects ALL pending public dependencies."

      - name: Verificar un plugin binario de Allay sin recompilarlo para Engine
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/smoke-legacy-plugin.sh

      - name: Validar y empaquetar beta Linux y SDK sin publicar
        if: github.event_name == 'pull_request' && github.base_ref == 'feat/minecraft-1.26.60'
        shell: bash
        run: |
          bash -n .github/scripts/package-engine-beta.sh
          ./gradlew :server:shadowJar :api:generatePomFileForRyzeApiPublication \
            -Pserver.version=0.14.3-beta.1 \
            -Pryzemcbe.apiVersion=0.30.0-engine-beta.1 \
            -Pallay.is-dev-build=true --no-daemon
          bash .github/scripts/package-engine-beta.sh engine-v0.14.3-beta.1

      - name: Adjuntar paquete beta candidato para revisión
        if: github.event_name == 'pull_request' && github.base_ref == 'feat/minecraft-1.26.60'
        uses: actions/upload-artifact@v7
        with:
          name: engine-beta-preview-${{ github.sha }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

      - name: Guardar resultados de pruebas para diagnóstico
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-test-reports-${{ github.sha }}
          path: |
            server/build/test-results/test/**
            server/build/reports/tests/test/**
          if-no-files-found: ignore

      - name: Upload built JARs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: engine-server-${{ github.sha }}
          path: server/build/libs/*.jar
          if-no-files-found: error
