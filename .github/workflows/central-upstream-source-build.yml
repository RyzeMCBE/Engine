name: Engine upstream source compatibility (no publishing)

on:
  pull_request:
    paths:
      - '.github/workflows/central-upstream-source-build.yml'
      - 'docs/central-upstream-sources.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-upstream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-upstream:
    name: Source build / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: math
            repository: CloudburstMC/math
            sha: 87f24259a74a5ed690251fcc940b97f3fb540e47
            java: '11'
          - target: natives
            repository: CloudburstMC/Natives
            sha: 41826fe18358f7358707dc55e698abc16cdcc49a
            java: '11'
          - target: raknet
            repository: CloudburstMC/Network
            sha: 78a3224e829f2c4bcfe5a298320477d2f46ce6fa
            java: '21'
          - target: nethernet
            repository: CloudburstMC/Network
            sha: 247cdfda6ec02cfef75bbdc9704ad1961245d6fb
            java: '21'
          - target: okaeri
            repository: OkaeriPoland/okaeri-configs
            sha: b20e94ea63fc3089bb892318ad305792a72274f9
            java: '11'
          - target: libdatachannel
            repository: opencollab-incubator/libdatachannel-java
            sha: 0eb42beb7f7b17e8b383ea848a52d1c2da0c8e7c
            java: '21'

    steps:
      - name: Check out pinned original source (and recursive submodules)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          submodules: recursive
          path: upstream

      - name: Verify source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f upstream/LICENSE -o -f upstream/LICENSE.txt
          echo "Checked out $EXPECTED_SHA"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y maven build-essential cmake pkg-config libssl-dev

      - name: Compile original source without deploying
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        working-directory: upstream
        run: |
          set -euo pipefail
          case "$TARGET" in
            math)
              # The historic source pins a vanished Maven shade SNAPSHOT.
              # Use the equivalent released plugin only in this CI checkout.
              sed -i 's/<version>3.3.0-SNAPSHOT<\/version>/<version>3.3.0<\/version>/' immutable/pom.xml
              mvn --batch-mode --no-transfer-progress -DskipTests -pl immutable -am package
              ;;
            natives)
              # Old Natives 1.0.3 Maven script invokes make with no Makefile.
              # Build JNI from its original CMake sources, then let Maven
              # package Java without invoking that broken legacy Ant task.
              sed -i 's/cmake_policy(SET CMP0048 OLD)/cmake_policy(SET CMP0048 NEW)/' CMakeLists.txt
              cmake -S . -B build-native -DCMAKE_POLICY_VERSION_MINIMUM=3.5
              # Only the Nukkit AES/SHA JNI target is used here. Building every
              # bundled zlib-ng target on modern GNU ld fails with an upstream
              # duplicate 'static_ltree' symbol unrelated to Nukkit JNI.
              cmake --build build-native --target nukkit-natives --parallel 2
              test -s src/main/resources/libnukkit-natives.so
              # Invoke the original compiler and JAR goals directly: the legacy
              # Linux Maven lifecycle still launches make in a directory with
              # no Makefile even with -Dantrun.skip=true. JNI already compiled.
              mvn --batch-mode --no-transfer-progress -DskipTests \
                org.apache.maven.plugins:maven-compiler-plugin:3.8.0:compile \
                org.apache.maven.plugins:maven-jar-plugin:3.2.0:jar
              ldd -r src/main/resources/libnukkit-natives.so
              ;;
            raknet)
              # The historical foojay 0.4 plugin does not work with
              # the current Gradle resolver; change only checkout tooling.
              sed -i 's/foojay-resolver-convention") version "0.4.0"/foojay-resolver-convention") version "1.0.0"/' settings.gradle.kts
              chmod +x gradlew
              ./gradlew :transport-raknet:assemble --no-daemon
              ;;
            nethernet)
              chmod +x gradlew
              ./gradlew :transport-nethernet:assemble --no-daemon
              ;;
            okaeri)
              mvn --batch-mode --no-transfer-progress -DskipTests -pl yaml-snakeyaml -am package
              ;;
            libdatachannel)
              chmod +x gradlew
              ./gradlew jar --no-daemon -Plibdatachannel.targets=linux-glibc-x86_64
              ;;
            *)
              echo "Unknown build target: $TARGET" >&2; exit 1
              ;;
          esac

      - name: List original build results
        shell: bash
        run: |
          set -euo pipefail
          find upstream -path '*/build/libs/*.jar' -o -path '*/target/*.jar' | head -60
          count=$(find upstream \( -path '*/build/libs/*.jar' -o -path '*/target/*.jar' \) | wc -l)
          test "$count" -gt 0

      - name: Upload original-source compile candidates (NOT published)
        uses: actions/upload-artifact@v7
        with:
          name: upstream-${{ matrix.target }}-${{ github.sha }}
          path: |
            upstream/**/build/libs/*.jar
            upstream/**/target/*.jar
          retention-days: 3
          if-no-files-found: error
