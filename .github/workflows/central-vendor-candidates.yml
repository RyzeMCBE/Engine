name: Engine Central source vendor candidates (NO PUBLISH)

on:
  pull_request:
    paths:
      - 'vendor-central/**'
      - '.github/workflows/central-vendor-candidates.yml'
      - 'docs/central-upstream-sources.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-central-vendor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-original-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Engine vendor build configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out NetherNet original source
        uses: actions/checkout@v7
        with:
          repository: CloudburstMC/Network
          ref: 247cdfda6ec02cfef75bbdc9704ad1961245d6fb
          path: vendor-upstream/nethernet
          persist-credentials: false
      - name: Check out Okaeri original source
        uses: actions/checkout@v7
        with:
          repository: OkaeriPoland/okaeri-configs
          ref: b20e94ea63fc3089bb892318ad305792a72274f9
          path: vendor-upstream/okaeri
          persist-credentials: false
      - name: Check out libdatachannel original source
        uses: actions/checkout@v7
        with:
          repository: opencollab-incubator/libdatachannel-java
          ref: 0eb42beb7f7b17e8b383ea848a52d1c2da0c8e7c
          submodules: recursive
          path: vendor-upstream/libdatachannel
          persist-credentials: false
      - name: Verify exact original commits and license files
        run: |
          set -euo pipefail
          test "$(git -C vendor-upstream/nethernet rev-parse HEAD)" = 247cdfda6ec02cfef75bbdc9704ad1961245d6fb
          test "$(git -C vendor-upstream/okaeri rev-parse HEAD)" = b20e94ea63fc3089bb892318ad305792a72274f9
          test "$(git -C vendor-upstream/libdatachannel rev-parse HEAD)" = 0eb42beb7f7b17e8b383ea848a52d1c2da0c8e7c
          test -s vendor-upstream/nethernet/LICENSE
          test -s vendor-upstream/okaeri/LICENSE
          test -s vendor-upstream/libdatachannel/LICENSE
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build original Java sources and prepare locally resolvable POMs
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p vendor-central clean build publishToMavenLocal --no-daemon
      - name: Verify candidates are not executable distribution artifacts
        run: |
          set -euo pipefail
          for module in ryze-transport-common ryze-netty-transport-nethernet ryze-okaeri-configs-core ryze-okaeri-configs-yaml-snakeyaml ryze-libdatachannel-java; do
            test -s "vendor-central/$module/build/publications/maven/pom-default.xml"
            test -n "$(find "vendor-central/$module/build/libs" -name '*sources.jar' -print -quit)"
            test -n "$(find "vendor-central/$module/build/libs" -name '*javadoc.jar' -print -quit)"
            test -n "$(find "vendor-central/$module/build/libs" -name '*.jar' ! -name '*sources.jar' ! -name '*javadoc.jar' -print -quit)"
            grep -q '<licenses>' "vendor-central/$module/build/publications/maven/pom-default.xml"
          done
          echo 'PASS: Java source candidates and local publication metadata. No Sonatype upload.'
      - name: Preserve original-source binaries for inspection
        uses: actions/upload-artifact@v7
        with:
          name: engine-central-original-source-review-${{ github.sha }}
          path: |
            vendor-central/**/build/libs/*.jar
            vendor-central/**/build/publications/maven/*.xml
          retention-days: 7
          if-no-files-found: error
