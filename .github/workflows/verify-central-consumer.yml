name: Maven Central - Verify independent Engine Server consumer (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-only-consumer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout independent sample from Engine main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify real public Engine Server POM and JAR
        shell: bash
        run: |
          set -euo pipefail
          base='https://repo.maven.apache.org/maven2/io/github/ryzemcbe/engine-server/0.14.3-beta.1'
          for ext in pom jar; do
            status="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "$base/engine-server-0.14.3-beta.1.$ext")"
            [[ "$status" == 200 ]] || {
              echo "::error::PUBLIC Engine Server $ext returned HTTP$status (expected 200)"; exit 1;
            }
          done

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Compile isolated Java developer using ONLY mavenCentral()
        shell: bash
        run: |
          set -euo pipefail
          # A new Gradle home prevents local caches or user-level repositories
          # from hiding missing public Maven Central dependencies.
          export GRADLE_USER_HOME="$(mktemp -d)"
          trap 'rm -rf "$GRADLE_USER_HOME"' EXIT
          chmod +x gradlew
          ./gradlew -p ci/central-consumer clean compileJava --no-daemon --refresh-dependencies

      - name: Confirm independent consumer passes without private repositories
        run: |
          echo 'PASS: engine-server and transitives resolved from mavenCentral() only.'
          echo 'PASS: compiled Engine server implementation, public API and Bedrock protocol types.'
          echo 'No GitHub Packages, JitPack, snapshots, local JAR or Maven Local used.'
