name: Engine Server - Central release candidate (NO PUBLISH)

on:
  pull_request:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'server/**'
      - 'gradle/**'
      - '.github/scripts/*central-server*'
      - '.github/scripts/audit-central-resolution.py'
      - '.github/maven-central-only-settings.xml'
      - '.github/workflows/publish-central-server.yml'
      - '.github/workflows/verify-central-server-release.yml'

permissions:
  contents: read

concurrency:
  group: engine-server-central-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout candidate and linked sources without credentials
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check public prerequisites and linked source revisions
        run: |
          python3 .github/scripts/check-central-server-prerequisites.py
          bash .github/scripts/check-linked-dependencies.sh

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test publication guards
        run: python3 .github/scripts/test-central-server-publication.py

      - name: Build and test the actual Central release variant
        run: |
          chmod +x gradlew
          ./gradlew build :server:plainJavadocJar :server:generatePomFileForMavenPublication :server:generateMetadataFileForMavenPublication \
            -PcentralRelease=true --no-daemon --stacktrace

      - name: Audit Central-only resolution and plain SDK artifacts
        run: bash .github/scripts/verify-central-server-release.sh

      - name: Preserve test reports and server startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-central-candidate-test-reports-${{ github.sha }}
          path: |
            server/build/test-results/test/**
            server/build/reports/tests/test/**
            .test/logs/**
            .test/hs_err_pid*.log
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

      - name: Preserve verified unsigned publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: engine-central-candidate-${{ github.sha }}
          path: |
            server/build/libs/server-0.14.3-beta.2*.jar
            server/build/publications/maven/*
          retention-days: 1
          if-no-files-found: error
