name: Maven Central - Engine Server (manual, signed)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'verify-signature does NOT upload anything'
        type: choice
        options:
          - verify-signature
          - upload
        required: true
      confirmation:
        description: 'For upload only, type ENVIAR-ENGINE-SERVER'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: engine-server-maven-central
  cancel-in-progress: false

jobs:
  signed-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.operation == 'verify-signature' ||
      (inputs.operation == 'upload' && inputs.confirmation == 'ENVIAR-ENGINE-SERVER'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    steps:
      - name: Checkout reviewed Engine main with original submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify original GPG identity and signing ability
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          expected='0DE435F45DAAE3CCB759E01B32F428403DE9E4D8'
          test -n "$PRIVATE_KEY" && test -n "$PASSPHRASE" || {
            echo '::error::Missing original GPG environment secrets'; exit 1;
          }
          [[ "$PRIVATE_KEY" == *'-----BEGIN PGP PRIVATE KEY BLOCK-----'* &&
             "$PRIVATE_KEY" == *'-----END PGP PRIVATE KEY BLOCK-----'* ]] || {
            echo '::error::Expected complete ASCII-armored original private key'; exit 1;
          }
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$PRIVATE_KEY" | gpg --batch --quiet --import >/dev/null 2>&1 || {
            echo '::error::Could not import GPG key'; exit 1;
          }
          gpg --batch --with-colons --list-secret-keys "$expected" |
            awk -F: -v expected="$expected" '$1=="fpr" && $10==expected {found=1} END {exit !found}' || {
              echo '::error::Key fingerprint differs from RyzeMCBE original'; exit 1;
            }
          printf 'Engine Server Maven Central dry-run\n' |
            gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 3 --local-user "$expected" --detach-sign --output /dev/null 3<<<"$PASSPHRASE" || {
              echo '::error::GPG passphrase/signature verification failed'; exit 1;
            }
          echo 'PASS: Original fingerprint and signing verified; no secrets displayed.'

      - name: Stop after signature-only check
        if: inputs.operation == 'verify-signature'
        run: echo 'PASS - signature verified, NO ARTIFACT WAS UPLOADED'

      - name: Setup Java 21
        if: inputs.operation == 'upload'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: inputs.operation == 'upload'
        uses: gradle/actions/setup-gradle@v6

      - name: Validate linked source revisions
        if: inputs.operation == 'upload'
        run: bash .github/scripts/check-linked-dependencies.sh

      - name: Check Engine version is immutable and not yet published
        if: inputs.operation == 'upload'
        shell: bash
        run: |
          set -euo pipefail
          for file in engine-server-0.14.3-beta.1.pom engine-server-0.14.3-beta.1.jar; do
            url="https://repo.maven.apache.org/maven2/io/github/ryzemcbe/engine-server/0.14.3-beta.1/$file"
            status="$(curl --silent --show-error --location --max-time 25 --output /dev/null --write-out '%{http_code}' "$url")"
            if [[ "$status" != 404 ]]; then
              echo "::error::Central $file HTTP $status, expected 404 before a NEW immutable publication"
              exit 1
            fi
          done

      - name: Build Engine and signed server library, sources and Javadoc
        if: inputs.operation == 'upload'
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew build :server:generatePomFileForMavenPublication :server:signMavenPublication \
            -PcentralRelease=true --no-daemon

      - name: Audit POM and ALL transitive dependencies with only Maven Central
        if: inputs.operation == 'upload'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-central-server-pom.py
          python3 .github/scripts/audit-central-resolution.py \
            server/build/publications/maven/pom-default.xml
          tmp_repo="$(mktemp -d)"
          trap 'rm -rf "$tmp_repo"' EXIT
          mvn --batch-mode --no-transfer-progress \
            --settings .github/maven-central-only-settings.xml \
            -Dmaven.repo.local="$tmp_repo" \
            -f server/build/publications/maven/pom-default.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.10.0:resolve

      - name: Verify signed publication files and licensing
        if: inputs.operation == 'upload'
        shell: bash
        run: |
          set -euo pipefail
          test -s server/build/publications/maven/pom-default.xml
          test -n "$(find server/build/libs -maxdepth 1 -name '*sources.jar' -print -quit)"
          test -n "$(find server/build/libs -maxdepth 1 -name '*javadoc.jar' -print -quit)"
          count="$(find server/build -name '*.asc' -type f | wc -l)"
          test "$count" -ge 4 || {
            echo '::error::Missing signatures for POM/JAR/sources/Javadoc'; exit 1;
          }
          test -f LICENSE || test -f LICENSE.txt

      - name: Upload signed Engine Server to Sonatype (user-managed deployment)
        if: inputs.operation == 'upload'
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          ./gradlew :server:publishToMavenCentral -PcentralRelease=true --no-daemon

      - name: Remind owner to review Sonatype deployment before manual Publish
        if: inputs.operation == 'upload'
        run: |
          echo 'Upload completed. This workflow did NOT automatically publish.'
          echo 'Inspect VALIDATED deployment at https://central.sonatype.com/publishing/deployments'
